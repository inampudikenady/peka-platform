global:
  scrape_interval: 15s

scrape_configs:

  - job_name: linux-node
    static_configs:
      - targets:
          - 172.16.165.11:9100
        labels:
          host: peka-linux-001

      - targets:
          - 172.16.165.12:9100
        labels:
          host: peka-linux-002

  - job_name: linux-process
    static_configs:
      - targets:
          - 172.16.165.11:9256
        labels:
          host: peka-linux-001

      - targets:
          - 172.16.165.12:9256
        labels:
          host: peka-linux-002

  - job_name: windows
    static_configs:
      - targets:
          - 172.16.165.21:9182
        labels:
          host: peka-win-001
