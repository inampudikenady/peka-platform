global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  - job_name: "linux-nodes"
    static_configs:
      - targets:
          - "10.50.1.4:9100"
          - "10.70.1.5:9100"

  - job_name: "windows-nodes"
    static_configs:
      - targets:
          - "10.70.1.4:9182"

  - job_name: "linux-processes"
    static_configs:
      - targets:
          - "10.50.1.4:9256"
          - "10.70.1.5:9256"
